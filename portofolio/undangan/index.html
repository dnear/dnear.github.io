<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            padding: clamp(12px, 3vw, 36px);
            background: #171717;
        }

        main {
            width: min(100%, 1500px);
            margin: 0 auto;
            padding: clamp(8px, 1.5vw, 20px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: #222;
        }

        .invitation-pages {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: start;
            gap: clamp(8px, 1.5vw, 20px);
        }

        img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
            }

            .invitation-pages {
                grid-template-columns: minmax(0, 1fr);
            }
        }
    </style>
</head>
<body>
    <main aria-label="Galeri undangan pernikahan">
        <div class="invitation-pages">
            <img src="1.png" alt="Desain undangan pernikahan, halaman pertama">
            <img src="2.png" alt="Desain undangan pernikahan, halaman kedua">
        </div>
    </main>
</body>
</html>
